# Tag-triggered releases: push a `v*` tag → a DRAFT release with per-OS
# GUI bundles + CLI tarballs. The owner reviews the draft and publishes.
#
# Design constraints:
# - tauri.conf.json keeps bundle.active=false (dev stays a plain shell);
#   each job re-enables bundling via --config, so no source file changes.
# - sherpa-onnx links statically and self-downloads at build time: there are
#   NO native libs to stage or ship next to the binaries on any OS.
# - macOS is unsigned (no Apple Developer ID yet) — the release body carries
#   the Gatekeeper right-click→Open workaround.
# - Models are never bundled; the app downloads them on first run.
# - Windows is EXPERIMENTAL (never human-tested): continue-on-error so a
#   Windows failure can't block a release.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Create the draft ONCE so the build jobs never race creating it.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: packaging/release-body-template.md
          generate_release_notes: true

  macos:
    needs: create-release
    runs-on: macos-latest # aarch64 (Apple Silicon)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend deps
        working-directory: crates/linefeed-gui
        run: npm ci
      - name: Build CLI
        run: cargo build --release -p linefeed-cli
      - name: Package CLI tarball
        run: |
          mkdir -p dist-cli
          cp target/release/linefeed dist-cli/
          # tar -C flags are positional: the second -C must be absolute or it
          # resolves relative to the first one.
          tar -czf linefeed-cli-macos-aarch64.tar.gz -C "$PWD/dist-cli" linefeed
      - name: Build GUI bundles (app + dmg)
        working-directory: crates/linefeed-gui
        run: npx tauri build --bundles app,dmg --config '{"bundle":{"active":true}}'
      - name: Collect bundles (locate outputs defensively, never hardcode)
        run: |
          echo "== everything under target/**/bundle =="
          find target -path "*bundle*" \( -name "*.app" -o -name "*.dmg" \) -maxdepth 6 | sed 's/^/  /'
          APP=$(find target -type d -name "*.app" -path "*bundle*" | head -1)
          DMG=$(find target -type f -name "*.dmg" -path "*bundle*" | head -1)
          test -n "$APP" && test -n "$DMG"
          ditto -c -k --sequesterRsrc --keepParent "$APP" linefeed.app-arm64-macos.zip
          cp "$DMG" linefeed-arm64-macos.dmg
      - name: Upload artifacts to the draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            linefeed-cli-macos-aarch64.tar.gz
            linefeed.app-arm64-macos.zip
            linefeed-arm64-macos.dmg
      - name: Checksums (for packaging formulas)
        run: shasum -a 256 linefeed-cli-macos-aarch64.tar.gz linefeed.app-arm64-macos.zip linefeed-arm64-macos.dmg

  linux:
    needs: create-release
    runs-on: ubuntu-latest # x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: System deps (webkit2gtk for tauri, alsa for cpal, libfuse2 to
              RUN the AppImage tooling on 24.04 runners)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libasound2-dev libssl-dev patchelf libfuse2
      - name: Frontend deps
        working-directory: crates/linefeed-gui
        run: npm ci
      - name: Build CLI
        run: cargo build --release -p linefeed-cli
      - name: Package CLI tarball
        run: |
          mkdir -p dist-cli
          cp target/release/linefeed dist-cli/
          tar -czf linefeed-cli-linux-x86_64.tar.gz -C "$PWD/dist-cli" linefeed
      - name: Build GUI bundles (deb + AppImage)
        working-directory: crates/linefeed-gui
        run: npx tauri build --bundles deb,appimage --config '{"bundle":{"active":true}}'
      - name: Upload artifacts to the draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            linefeed-cli-linux-x86_64.tar.gz
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
      - name: Checksums
        run: sha256sum linefeed-cli-linux-x86_64.tar.gz target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage

  windows:
    needs: create-release
    runs-on: windows-latest # x86_64
    # Experimental: linefeed has never been human-tested on Windows.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend deps
        working-directory: crates/linefeed-gui
        run: npm ci
      - name: Build CLI
        run: cargo build --release -p linefeed-cli
      - name: Package CLI zip
        shell: pwsh
        run: Compress-Archive -Path target/release/linefeed.exe -DestinationPath linefeed-cli-windows-x86_64.zip
      - name: Build GUI bundle (msi)
        working-directory: crates/linefeed-gui
        run: npx tauri build --bundles msi --config '{"bundle":{"active":true}}'
      - name: Upload artifacts to the draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            linefeed-cli-windows-x86_64.zip
            target/release/bundle/msi/*.msi
      - name: Checksums
        shell: pwsh
        run: Get-FileHash linefeed-cli-windows-x86_64.zip, (Get-Item target/release/bundle/msi/*.msi) -Algorithm SHA256 | Format-List
