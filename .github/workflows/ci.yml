name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never

jobs:
  # Core + ASR + CLI on both platforms. Bare cargo commands stay CLI-scoped
  # via workspace default-members (the GUI crate needs webkit2gtk).
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA dev (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: rustfmt
        run: cargo fmt --check
      - name: Core tests (default + serde)
        run: |
          cargo test -p linefeed-core
          cargo test -p linefeed-core --features serde
      - name: ASR + CLI tests (sherpa + mic)
        run: cargo test -p linefeed-asr -p linefeed-cli --features linefeed-asr/sherpa,linefeed-asr/mic
      - name: Release build
        run: cargo build --release -p linefeed-cli

  # Feature-combo guard: every combination must build with ZERO warnings.
  # Single-feature combos break silently when only the full set is tested.
  feature-combos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA dev
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: No-default-features (timeline-only CLI)
        run: |
          cargo build --no-default-features -p linefeed-cli 2>&1 | tee build-min.log
          ! grep -E "^(warning|error)" build-min.log
      - name: sherpa only (no mic)
        run: |
          cargo build --no-default-features --features sherpa -p linefeed-cli 2>&1 | tee build-sherpa.log
          ! grep -E "^(warning|error)" build-sherpa.log
      - name: mic only (no engine)
        run: |
          cargo build --no-default-features --features mic -p linefeed-cli 2>&1 | tee build-mic.log
          ! grep -E "^(warning|error)" build-mic.log

  # GUI: Rust side compiles + tests on a real webkit2gtk install; frontend
  # type-checks, builds, and passes its node --test suites.
  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install GUI system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libasound2-dev libssl-dev
      - name: Frontend install + tests + build
        working-directory: crates/linefeed-gui
        run: |
          npm ci
          npm test
          npm run build
      - name: GUI Rust tests
        run: cargo test -p linefeed-gui --lib
      - name: GUI zero-warning check
        run: |
          cargo build -p linefeed-gui 2>&1 | tee build-gui.log
          ! grep -E "^(warning|error)" build-gui.log

  # Deterministic E2E: replay a synthetic timeline through the real CLI and
  # assert the tracker reaches the end. No models, no audio, fully offline.
  replay-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI (timeline replay needs no engine)
        run: cargo build --no-default-features -p linefeed-cli
      - name: Synthesize script + timeline and replay
        run: |
          python3 - <<'EOF'
          import json
          words = ("hoje vamos montar um servidor caseiro completo com kubernetes "
                   "rodando em tres maquinas pequenas depois configuramos o backup "
                   "automatico da rede inteira").split()
          open("script.txt", "w").write(" ".join(words) + "\n")
          t, lines = 0.0, []
          for i in range(0, len(words), 3):
              chunk = words[i:i+3]
              ws = [[w, round(t + j*0.3, 2)] for j, w in enumerate(chunk)]
              t += 1.0
              lines.append(json.dumps({"t_fed": round(t, 2), "words": ws}))
          open("take.jsonl", "w").write("\n".join(lines) + "\n")
          EOF
          ./target/debug/linefeed replay script.txt --timeline take.jsonl | tee replay.log
          grep -E "^final: cursor [0-9]+/[0-9]+ \(100.0%\)" replay.log
